<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hafij AI — Question & Answer</title>

<meta name="description"
content="Hafij AI - Ask questions and get AI answers">

<meta name="theme-color" content="#0b1020">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#0b1020;
    color:#eef2ff;
    min-height:100vh;
}

.app{
    max-width:900px;
    min-height:100vh;
    margin:auto;
    display:flex;
    flex-direction:column;
}

/* HEADER */

header{
    padding:20px;
    border-bottom:1px solid #202a44;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:23px;
    font-weight:800;
}

.logo span{
    color:#7c8cff;
}

.badge{
    font-size:12px;
    padding:7px 10px;
    border:1px solid #293454;
    border-radius:50px;
    color:#aeb9d8;
}

/* MAIN */

main{
    flex:1;
    padding:30px 18px 130px;
}

.hero{
    text-align:center;
    padding:45px 10px 30px;
}

.hero h1{
    font-size:clamp(34px,7vw,55px);
    margin-bottom:14px;
}

.hero p{
    color:#9eabc9;
    line-height:1.6;
}

/* CHAT */

.chat{
    display:flex;
    flex-direction:column;
    gap:16px;
}

.msg{
    max-width:82%;
    padding:14px 17px;
    border-radius:18px;
    line-height:1.6;
    white-space:pre-wrap;
    word-wrap:break-word;
}

.user{
    align-self:flex-end;
    background:#5865f2;
}

.ai{
    align-self:flex-start;
    background:#151d33;
    border:1px solid #26314f;
}

.empty{
    text-align:center;
    color:#7785a8;
    padding:20px;
}

/* COMPOSER */

.composer{
    position:fixed;
    left:0;
    right:0;
    bottom:0;

    background:rgba(11,16,32,.95);
    backdrop-filter:blur(12px);

    border-top:1px solid #202a44;

    padding:14px;
}

.composer-inner{
    max-width:900px;
    margin:auto;

    display:flex;
    gap:10px;
}

textarea{
    flex:1;

    resize:none;

    min-height:52px;
    max-height:140px;

    background:#121a2d;
    color:white;

    border:1px solid #2a3656;
    border-radius:16px;

    padding:15px;

    outline:none;

    font-size:15px;
}

textarea:focus{
    border-color:#6675ff;
}

button{
    border:0;
    border-radius:15px;

    padding:0 20px;

    background:#6675ff;
    color:white;

    font-weight:700;

    cursor:pointer;
}

button:hover{
    filter:brightness(1.1);
}

button:disabled{
    opacity:.55;
    cursor:not-allowed;
}

.actions{
    max-width:900px;
    margin:10px auto 0;

    display:flex;
}

.small{
    padding:9px 13px;
    font-size:12px;

    background:#151d33;
    border:1px solid #293454;
}

/* MOBILE */

@media(max-width:600px){

    main{
        padding-left:12px;
        padding-right:12px;
    }

    header{
        padding:18px 14px;
    }

    .hero{
        padding-top:30px;
    }

    .msg{
        max-width:92%;
    }

}
</style>
</head>


<body>

<div class="app">

    <!-- HEADER -->

    <header>

        <div class="logo">
            Hafij <span>AI</span>
        </div>

        <div class="badge">
            Question & Answer
        </div>

    </header>


    <!-- MAIN -->

    <main>

        <section class="hero" id="hero">

            <h1>
                Ask anything.
            </h1>

            <p>
                একটি প্রশ্ন লিখুন এবং AI-এর কাছ থেকে উত্তর পান।
            </p>

        </section>


        <section class="chat" id="chat">

            <div class="empty" id="empty">
                আপনার প্রথম প্রশ্নটি লিখুন 👇
            </div>

        </section>

    </main>


    <!-- INPUT -->

    <div class="composer">

        <div class="composer-inner">

            <textarea
                id="question"
                placeholder="আপনার প্রশ্ন লিখুন..."
                rows="1">
            </textarea>

            <button id="send">
                Ask
            </button>

        </div>


        <div class="actions">

            <button
                class="small"
                id="clear">

                Clear Chat

            </button>

        </div>

    </div>

</div>



<script>

/* =====================================================
   AI API
===================================================== */


/*
   IMPORTANT:

   GitHub Pages-এ সরাসরি AI API key রাখবেন না।

   আপনার secure backend/API URL এখানে বসাবেন।

   Example:

   const API_URL =
   "https://your-backend.example.com/ask";

*/

const API_URL = "";



/* =====================================================
   ELEMENTS
===================================================== */

const question =
    document.getElementById("question");

const send =
    document.getElementById("send");

const clear =
    document.getElementById("clear");

const chat =
    document.getElementById("chat");

const hero =
    document.getElementById("hero");

const empty =
    document.getElementById("empty");



/* =====================================================
   ADD MESSAGE
===================================================== */

function addMessage(text,type){

    if(document.getElementById("empty")){
        document.getElementById("empty").remove();
    }

    hero.style.display="none";


    const div =
        document.createElement("div");

    div.className =
        "msg " + type;

    div.textContent =
        text;


    chat.appendChild(div);


    window.scrollTo({
        top:document.body.scrollHeight,
        behavior:"smooth"
    });

}



/* =====================================================
   AI REQUEST
===================================================== */

async function askAI(q){

    /*
       API না থাকলে demo message
    */

    if(!API_URL){

        return `
Demo Mode

আপনার প্রশ্ন:

${q}

AI API এখনো যুক্ত করা হয়নি।

GitHub Pages-এ API key সরাসরি রাখা নিরাপদ নয়।
একটি secure backend API যুক্ত করলে এখানে
সত্যিকারের AI উত্তর আসবে।
        `;

    }


    const response =
        await fetch(API_URL,{

            method:"POST",

            headers:{
                "Content-Type":
                "application/json"
            },

            body:JSON.stringify({

                question:q

            })

        });


    if(!response.ok){

        throw new Error(
            "API request failed"
        );

    }


    const data =
        await response.json();


    return data.answer ||
        "কোনো উত্তর পাওয়া যায়নি।";

}



/* =====================================================
   SEND QUESTION
===================================================== */

async function sendQuestion(){

    const q =
        question.value.trim();


    if(!q || send.disabled){

        return;

    }


    /* User message */

    addMessage(
        q,
        "user"
    );


    question.value="";


    send.disabled=true;

    send.textContent="...";


    /* Loading */

    const loading =
        document.createElement("div");

    loading.className="msg ai";

    loading.textContent=
        "উত্তর তৈরি হচ্ছে...";


    chat.appendChild(loading);


    try{

        const answer =
            await askAI(q);


        loading.remove();


        addMessage(
            answer,
            "ai"
        );

    }

    catch(error){

        loading.textContent=
            "দুঃখিত, AI server-এর সাথে যোগাযোগ করা যাচ্ছে না।";

        console.error(error);

    }

    finally{

        send.disabled=false;

        send.textContent="Ask";

        question.focus();

    }

}



/* =====================================================
   SEND BUTTON
===================================================== */

send.addEventListener(
    "click",
    sendQuestion
);



/* =====================================================
   ENTER KEY
===================================================== */

question.addEventListener(
    "keydown",
    function(e){

        if(
            e.key==="Enter" &&
            !e.shiftKey
        ){

            e.preventDefault();

            sendQuestion();

        }

    }
);



/* =====================================================
   AUTO TEXTAREA HEIGHT
===================================================== */

question.addEventListener(
    "input",
    function(){

        question.style.height="auto";

        question.style.height =
            Math.min(
                question.scrollHeight,
                140
            ) + "px";

    }
);



/* =====================================================
   CLEAR CHAT
===================================================== */

clear.addEventListener(
    "click",
    function(){

        chat.innerHTML = `

            <div
                class="empty"
                id="empty">

                আপনার প্রথম প্রশ্নটি লিখুন 👇

            </div>

        `;


        hero.style.display="";


        question.focus();

    }
);

</script>

</body>
</html>
